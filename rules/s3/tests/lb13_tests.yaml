- name: ELB with 2 subnets, PASS
  input:
    Resources:
      MyELB:
        Type: AWS::ElasticLoadBalancing::LoadBalancer
        Properties:
          Subnets:
            - subnet-12345678
            - subnet-87654321
  expectations:
    rules:
      ELB_SUBNETS_COUNT: PASS

- name: ELB with 1 subnet, FAIL 
  input:
    Resources:
      MyELB:
        Type: AWS::ElasticLoadBalancing::LoadBalancer
        Properties:
          Subnets:
            - subnet-12345678
  expectations:
    rules:
      ELB_SUBNETS_COUNT: FAIL

